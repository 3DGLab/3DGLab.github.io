# Lab members.
# _includes/professor.liquid shows the professor as a profile.
# _includes/students.liquid shows each student group as small cards, up to three in a row.
#
# Fields of a person:
#   name     (required)
#   role     (required) for alumni, write the degree and the year
#   image    photo file name in assets/img/people/. Without it, a card shows the lab symbol.
#   email, website, scholar (Google Scholar user ID), github (user name)
#
# To add a student group, add an entry with a title and its members to "students".

