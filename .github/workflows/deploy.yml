name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Install JS deps 📦
        run: npm ci
      - name: Build 🔧
        run: JEKYLL_ENV=production bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: npx purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
      # The checks run after the deployment. A failure marks the run, but it does not stop the publication.
      - name: Check the internal links 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          # Every internal link of the site starts with "/". The root dir tells lychee which folder "/" is.
          args: --offline --root-dir ${{ github.workspace }}/_site --verbose --no-progress '_site/**/*.html'
      - name: Check the format 🔎
        run: npm run lint:prettier
      - name: Check the theme contract 🧪
        run: bundle exec al-folio upgrade audit
